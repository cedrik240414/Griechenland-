name = "hellas-server"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World", "Directory", "Store"]

[vars]
ADMIN_NAME = "Crim"
# ADMIN_PW_HASH (SHA-256 des Admin-Passworts) wird als Secret gesetzt:
#   npx wrangler secret put ADMIN_PW_HASH
